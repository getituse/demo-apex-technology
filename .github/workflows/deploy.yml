name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Determine Site URL
        id: site-url
        run: |
          # Use Pages base_url or fallback to default github.io repository URL
          BASE_URL="${{ steps.pages.outputs.base_url }}"
          if [ -z "$BASE_URL" ]; then
            BASE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          fi
          # Parse origin and pathname
          ORIGIN=$(echo "$BASE_URL" | sed -E 's|(https?://[^/]+).*|\1|')
          PATHNAME=$(echo "$BASE_URL" | sed -E 's|https?://[^/]+/?||')
          if [ -n "$PATHNAME" ]; then
            LOWER_PATH=$(echo "$PATHNAME" | tr '[:upper:]' '[:lower:]')
            CALCULATED_SITE_URL="${ORIGIN}/${LOWER_PATH}"
          else
            CALCULATED_SITE_URL="${ORIGIN}"
          fi
          echo "url=${CALCULATED_SITE_URL}" >> $GITHUB_OUTPUT
          echo "Calculated site URL: ${CALCULATED_SITE_URL}"

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build static site
        env:
          SITE_URL: ${{ steps.site-url.outputs.url }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
